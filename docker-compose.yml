# Local development services. Credentials match env.exmaple.
#   docker compose up -d      start Postgres
#   docker compose down -v    stop and wipe data
services:
  db:
    image: postgres:17-alpine
    container_name: tpa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE__USERNAME:-web-app}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-web-app}
      POSTGRES_DB: ${DATABASE__DATABASE_NAME:-web-app}
    ports:
      # Bound to localhost only; not exposed on the network.
      - "127.0.0.1:${DATABASE__PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
